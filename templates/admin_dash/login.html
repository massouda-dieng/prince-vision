<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Prince Vision</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#F5F5F5;font-family:'Jost',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg-glow{position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(212,175,55,.05) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.login-box{position:relative;z-index:10;width:100%;max-width:420px;padding:2rem}
.login-logo{text-align:center;margin-bottom:2.5rem}
.login-logo-img{height:110px;width:auto;display:block;margin:0 auto 1rem;filter:brightness(0) saturate(100%) invert(77%) sepia(40%) saturate(600%) hue-rotate(5deg) brightness(95%);animation:logoDrop .8s ease forwards}
@keyframes logoDrop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.login-subtitle{color:#555;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
.gold-line{width:50px;height:1px;background:#D4AF37;margin:1.2rem auto}
.login-card{background:#0a0a0a;border:1px solid rgba(212,175,55,.15);padding:2.5rem;animation:cardUp .6s .2s ease both}
@keyframes cardUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.form-group{margin-bottom:1.5rem}
.form-label{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(245,245,245,.4);display:block;margin-bottom:.5rem}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#444;pointer-events:none}
.form-input{width:100%;background:#111;border:1px solid rgba(212,175,55,.15);color:#F5F5F5;padding:.9rem 1rem .9rem 2.8rem;font-family:'Jost',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s,box-shadow .3s}
.form-input:focus{border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.08)}
.form-input::placeholder{color:#444}
.form-submit{width:100%;padding:1.1rem;background:#D4AF37;color:#050505;border:none;font-family:'Jost',sans-serif;font-size:.82rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s;margin-top:.5rem}
.form-submit:hover{box-shadow:0 8px 30px rgba(212,175,55,.4);transform:translateY(-1px)}
.error-msg{background:rgba(229,85,85,.08);border:1px solid rgba(229,85,85,.25);color:#e77;padding:1rem;margin-bottom:1.5rem;font-size:.85rem}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:#444;font-size:.78rem;text-decoration:none;transition:color .3s}
.back-link a:hover{color:#D4AF37}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div class="login-box">
  <div class="login-logo">
    <img src="/static/images/logo_pv_gold.png" alt="Prince Vision" class="login-logo-img">
    <div class="login-subtitle">Espace Administrateur</div>
    <div class="gold-line"></div>
  </div>
  <div class="login-card">
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Identifiant</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" name="username" class="form-input" placeholder="Nom d'utilisateur" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="form-submit">✦ &nbsp; Se connecter</button>
    </form>
  </div>
  <div class="back-link"><a href="/">← Retour au site Prince Vision</a></div>
</div>
</body>
</html>
